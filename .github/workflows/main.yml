name: 🔄 Auto Update Worker

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 1 * * *"  # 🕐 每天凌晨1点自动运行
  workflow_dispatch:      # 🖐️ 支持手动触发（强制推送更新至仓库）

permissions:
  contents: write

jobs:
  update:
    name: 🚀 同步原版 Worker 文件（不混淆、不压缩）
    runs-on: ubuntu-latest
    steps:
      - name: 📥 初始化代码仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🔧 配置 Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase false

      - name: 🔍 检查文件状态
        id: check_files
        run: |
          echo "🔍 $(date '+%Y-%m-%d %H:%M:%S') - 检查文件状态..."
          
          if [[ -f "version.txt" ]]; then
            LOCAL_VERSION=$(cat version.txt)
            echo "✅ version.txt 存在，版本: $LOCAL_VERSION"
            echo "HAS_VERSION=true" >> $GITHUB_ENV
          else
            echo "📝 version.txt 不存在"
            echo "HAS_VERSION=false" >> $GITHUB_ENV
          fi
          
          if [[ "$HAS_VERSION" == "false" || ! -f "source.js" || ! -f "_worker.js" ]]; then
            echo "🔄 检测到文件缺失，需要强制更新"
            echo "FORCE_UPDATE=true" >> $GITHUB_ENV
          else
            echo "FORCE_UPDATE=false" >> $GITHUB_ENV
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "🖐️ 手动触发，强制更新"
            echo "FORCE_UPDATE=true" >> $GITHUB_ENV
          fi

      - name: 🌐 获取远程文件信息
        id: remote_info
        run: |
          echo "🌍 $(date '+%Y-%m-%d %H:%M:%S') - 正在获取远程文件..."
          RAW_URL="https://raw.githubusercontent.com/cmliu/edgetunnel/refs/heads/main/_worker.js"
          
          for i in {1..3}; do
            echo "🔁 第 $i 次尝试获取远程文件..."
            if curl -f -s -o /tmp/remote_worker.js "$RAW_URL"; then
              FILE_SIZE=$(stat -c%s /tmp/remote_worker.js 2>/dev/null || stat -f%z /tmp/remote_worker.js 2>/dev/null)
              if [[ $FILE_SIZE -gt 1000 ]]; then
                FILE_HASH=$(sha256sum /tmp/remote_worker.js | cut -d' ' -f1)
                echo "✅ 远程文件获取成功"
                echo "REMOTE_VERSION=$FILE_HASH" >> $GITHUB_ENV
                break
              fi
            fi
            
            if [[ $i -eq 3 ]]; then
              echo "❌ 获取远程文件失败"
              exit 1
            fi
            sleep 5
          done

      - name: 📊 版本比对和更新决策
        id: update_decision
        run: |
          echo "📊 $(date '+%Y-%m-%d %H:%M:%S') - 版本比对..."
          
          if [[ "$FORCE_UPDATE" == "true" ]]; then
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          elif [[ -f "version.txt" ]]; then
            LOCAL_VERSION=$(cat version.txt)
            if [[ "$LOCAL_VERSION" == "$REMOTE_VERSION" ]]; then
              echo "🎉 版本一致，无需更新"
              echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
            else
              echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
            fi
          else
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi

      # ==============================
      # 关键修改：只同步原版代码，不做任何处理
      # ==============================
      - name: ⬇️ 下载并保存原版代码
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "⬇️ 保存原版 Worker..."
          cp /tmp/remote_worker.js _worker.js
          cp /tmp/remote_worker.js source.js
          echo "✅ 原版代码已保存，不混淆、不压缩"

      - name: 📝 更新版本号并提交
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "$REMOTE_VERSION" > version.txt
          git add source.js _worker.js version.txt
          if git diff --staged --quiet; then
            echo "ℹ️ 无更改，跳过提交"
            exit 0
          fi
          git commit -m "🔄 Auto Update Worker（原版不混淆）
          • 同步官方原版代码
          • 无混淆、无压缩
          • 版本: ${REMOTE_VERSION:0:16}"
          git push
          echo "✅ 提交完成"

      - name: 📦 打包原版文件
        run: |
          zip pages.zip _worker.js
          echo "zip_created=true" >> $GITHUB_ENV
        if: env.UPDATE_NEEDED == 'true'

      - name: 🚀 发布到 Releases
        uses: softprops/action-gh-release@v2
        if: env.UPDATE_NEEDED == 'true'
        with:
          tag_name: auto-${{ github.sha }}
          name: Worker 原版自动发布
          body: |
            ✅ 已同步官方原版代码
            ✅ 不混淆、不压缩
            📦 直接用于 Cloudflare Pages
          files: pages.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🎉 更新完成
        if: env.UPDATE_NEEDED == 'true'
        run: echo "🎉 已同步原版代码完成！"

      - name: 😴 无需更新
        if: env.UPDATE_NEEDED == 'false'
        run: echo "😴 当前已是最新版本"

  cleanup:
    name: 🧹 清理工作流记录
    runs-on: ubuntu-latest
    needs: update
    permissions:
      actions: write
      contents: read
    if: always()
    steps:
      - name: 🗑️ 删除旧工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3
